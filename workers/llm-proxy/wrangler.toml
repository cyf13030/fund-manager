name = "fund-manager-llm-proxy"
main = "src/index.ts"
compatibility_date = "2026-04-04"
workers_dev = true

# 本地调试端口（可选）
[dev]
port = 8787

# 生产环境建议绑定自定义域名的同源路径
# 例如：routes = [{ pattern = "example.com/llm-proxy/*", zone_name = "example.com" }]
# 如果当前 Cloudflare 账号没有自定义域名 zone 权限，可直接使用 workers.dev 地址。
# 限制可代理上游主机和允许跨域调用的前端来源（逗号分隔）
[vars]
LLM_PROXY_ALLOWED_HOSTS = "subapi.muxueai.pro,api.openai.com,api.deepseek.com,openrouter.ai,generativelanguage.googleapis.com"
LLM_PROXY_ALLOWED_ORIGINS = "https://cyf13030.github.io,https://gp.hrfuqiang.top"
